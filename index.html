<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Numerology Blueprint</title>
  
  <!-- SEO & Metadata -->
  <meta name="description" content="Professional interactive astrology and numerology web application generating your Birth Blueprint.">
  <meta name="keywords" content="astrology, numerology, birth chart, zodiac, interactive chart">
  <meta name="author" content="Astro Numerology Blueprint">
  <link rel="canonical" href="https://astro-numerology-blueprint.app/">
  <meta name="theme-color" content="#050505">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://astro-numerology-blueprint.app/">
  <meta property="og:title" content="Astro Numerology Blueprint">
  <meta property="og:description" content="Professional interactive astrology and numerology web application generating your Birth Blueprint.">
  <meta property="og:image" content="https://astro-numerology-blueprint.app/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://astro-numerology-blueprint.app/">
  <meta property="twitter:title" content="Astro Numerology Blueprint">
  <meta property="twitter:description" content="Professional interactive astrology and numerology web application generating your Birth Blueprint.">
  <meta property="twitter:image" content="https://astro-numerology-blueprint.app/og-image.png">

  <!-- Favicons & Manifest -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Security Policies -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Astro Numerology Blueprint",
    "description": "Professional interactive astrology and numerology web application generating your Birth Blueprint.",
    "author": {
      "@type": "Organization",
      "name": "Astro Numerology Blueprint"
    },
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "All"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cinzel:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="shell">
    <section class="intro">
      <canvas id="skyCanvas" aria-hidden="true"></canvas>
      <div class="intro-copy">
        <p class="eyebrow">Astrology + Numerology</p>
        <h1>Birth Blueprint</h1>
        <p class="lede">Enter birth details to generate Mulank, Bhagyank, planetary houses, and a reading across love, career, success, money, health, and personality.</p>
      </div>
    </section>

    <section class="form-section" aria-label="Astrology birth chart generator">
      <form id="astroForm" class="panel form-panel">
        <div class="panel-heading">
          <span class="orbital-mark">☉</span>
          <div>
            <h2>Your Details</h2>
            <p>Use coordinates when you know them. Otherwise choose a city or type your place.</p>
          </div>
        </div>

        <label>
          <span>Full name</span>
          <input id="fullName" name="fullName" type="text" placeholder="e.g. Ananya Sharma" autocomplete="name" required>
        </label>

        <div class="field-grid">
          <label>
            <span>Date of birth</span>
            <input id="birthDate" name="birthDate" type="date" required>
          </label>
          <label>
            <span>Time of birth</span>
            <input id="birthTime" name="birthTime" type="time" required>
          </label>
        </div>

        <label>
          <span>Area / city of birth</span>
          <input id="birthPlace" name="birthPlace" type="text" list="cityList" placeholder="e.g. Delhi, India" required>
          <datalist id="cityList"></datalist>
        </label>

        <div class="field-grid three">
          <label>
            <span>Latitude</span>
            <input id="latitude" name="latitude" type="number" step="0.0001" min="-66" max="66" placeholder="28.6139">
          </label>
          <label>
            <span>Longitude</span>
            <input id="longitude" name="longitude" type="number" step="0.0001" min="-180" max="180" placeholder="77.2090">
          </label>
          <label>
            <span>UTC offset</span>
            <input id="timezone" name="timezone" type="number" step="0.25" min="-12" max="14" value="5.5">
          </label>
        </div>

        <div class="action-row">
          <button type="submit">Generate Reading</button>
          <button type="button" id="sampleBtn" class="ghost-button">Try Sample</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
